[package]
name = "runeward-mcp"
description = "Model Context Protocol server exposing Rune Box's governed Citadel and Cohort tools over stdio and streamable HTTP"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
runeward-authz.workspace = true
runeward-browser.workspace = true
runeward-charter.workspace = true
runeward-controlplane.workspace = true
runeward-credentials.workspace = true
axum.workspace = true
clap.workspace = true
hex.workspace = true
http.workspace = true
hyper = { workspace = true, features = ["http2"] }
hyper-util = { workspace = true, features = ["http2", "server-auto", "server-graceful", "service"] }
rmcp.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-rustls.workspace = true
tokio-util.workspace = true
tracing.workspace = true

[dev-dependencies]
async-trait.workspace = true
chrono.workspace = true
http-body-util.workspace = true
rcgen.workspace = true
rmcp = { workspace = true, features = ["client"] }
runeward-backend.workspace = true
runeward-ledger.workspace = true
runeward-policy.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
tower.workspace = true
