[package]
name = "runeward-browser"
description = "Browser driver wire contract, minimal CDP client and the in-sandbox runeward-browser driver"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[[bin]]
name = "runeward-browser"
path = "src/main.rs"
doc = false

[dependencies]
base64.workspace = true
bytes.workspace = true
futures-util.workspace = true
http-body-util.workspace = true
httparse.workspace = true
hyper.workspace = true
hyper-util.workspace = true
runeward-ledger.workspace = true
# Pins the ring provider for wss:// DevTools URLs (no aws-lc).
rustls.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
subtle.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
url.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tokio-tungstenite.workspace = true
futures-util.workspace = true
