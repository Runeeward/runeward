# Lightweight DAST: build runeward, run it locally with auth enabled, and run
# the OWASP ZAP baseline scan against the live server.
#
# The baseline gate fails on ZAP FAIL-level findings. Warning-only findings are
# retained in the report while authenticated RBAC/API coverage runs in CI.
name: dast

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly (Mondays 08:31 UTC).
    - cron: "31 8 * * 1"

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: "1.95"
  CARGO_TERM_COLOR: always

jobs:
  zap-baseline:
    name: ZAP baseline
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        run: |
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal
          rustup default "${RUST_TOOLCHAIN}"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build runeward
        run: |
          cargo build --release --locked -p runeward-cli --bin runeward
          cp target/release/runeward ./runeward

      - name: Start runeward
        env:
          RUNEWARD_API_TOKEN: ci-dast-token
        run: |
          # Bind to loopback on 8080; the token is set so the API is exercised
          # in an authenticated posture (ZAP itself crawls unauthenticated).
          ./runeward serve --bind 127.0.0.1 --port 8080 >runeward.log 2>&1 &
          echo $! > runeward.pid

      - name: Wait for /healthz
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/healthz >/dev/null 2>&1; then
              echo "runeward is up"
              exit 0
            fi
            sleep 1
          done
          echo "::error::runeward did not become healthy within 30s"
          echo "----- runeward.log -----"
          cat runeward.log || true
          exit 1

      - name: ZAP baseline scan
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: http://127.0.0.1:8080
          token: ${{ secrets.GITHUB_TOKEN }}
          # Keep issue permissions off, but make FAIL-level findings blocking.
          allow_issue_writing: false
          fail_action: true
          # Preserve warnings in the report without failing the gate on them.
          cmd_options: "-I"

      - name: Stop runeward
        if: always()
        run: |
          if [ -f runeward.pid ]; then
            kill "$(cat runeward.pid)" 2>/dev/null || true
          fi

      - name: Upload runeward log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: runeward-dast-log
          path: runeward.log
          if-no-files-found: ignore
