name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # Matches the workspace MSRV (Cargo.toml rust-version). The rust builder
  # images in deploy/ track newer stable releases via Dependabot.
  RUST_TOOLCHAIN: "1.95"
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  build-test:
    name: fmt, clippy, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        run: |
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal --component rustfmt,clippy
          rustup default "${RUST_TOOLCHAIN}"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: cargo test
        run: cargo test --workspace --locked

      - name: release build
        run: cargo build --workspace --release --locked

      - name: strict production Charter examples
        run: ./target/release/runeward --config-dir examples/safe validate --strict

  portability:
    name: build CLI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        shell: bash
        run: |
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal
          rustup default "${RUST_TOOLCHAIN}"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # runeward-supervisor and runeward-egress are Linux-only binaries; the
      # CLI (control plane, MCP server, Kubernetes client) is cross-platform.
      - name: build runeward
        run: cargo build --locked -p runeward-cli --bin runeward
      - name: strict production Charter examples
        shell: bash
        run: ./target/debug/runeward --config-dir examples/safe validate --strict

  authenticated-e2e:
    name: authenticated API + six-role E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        run: |
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal
          rustup default "${RUST_TOOLCHAIN}"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build release binary
        run: |
          cargo build --release --locked -p runeward-cli --bin runeward
          cp target/release/runeward runeward-e2e
      - name: Run authenticated role and automation suite
        env:
          RUNEWARD_E2E_BINARY: ${{ github.workspace }}/runeward-e2e
        run: ./scripts/e2e-rbac.sh
      - name: Test authenticated fleet drivers and signed task leases
        run: ./scripts/test-fleet-drivers.sh

  # Opt-in tests that drive a real Docker engine: container lifecycle, exec,
  # snapshots, persistent workspaces and forks, and the supervised + brokered
  # sandbox (Landlock, seccomp, credential injection). They remove only what
  # they create.
  docker-integration:
    name: Docker integration tests
    runs-on: ubuntu-latest
    env:
      RUNEWARD_TEST_DOCKER: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        run: |
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal
          rustup default "${RUST_TOOLCHAIN}"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Pull base images
        run: |
          docker pull alpine
          docker pull debian:stable-slim
      - name: Backend lifecycle on Docker
        run: cargo test --locked -p runeward-backend --test docker_integration -- --test-threads=1 --nocapture
      - name: Workspaces, governance and credentials on Docker
        run: |
          cargo test --locked -p runeward-controlplane \
            --test docker_workspaces --test docker_governance \
            -- --test-threads=1 --nocapture

  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.16.2
      - name: helm lint
        run: helm lint deploy/helm/runeward
      - name: helm template (controller + server)
        run: helm template runeward deploy/helm/runeward --set server.enabled=true >/dev/null

  python-sdk:
    # The SDK supports Python 3.9, which setup-python no longer provides on
    # the Ubuntu 26.04 image behind ubuntu-latest.
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.9", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: package version consistency
        run: python scripts/check-sdk-versions.py
      - run: python -m pip install ./adapters/python
      - run: python -m unittest discover -s adapters/python/tests

  typescript-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - working-directory: adapters/typescript
        run: npm ci --ignore-scripts
      - working-directory: adapters/typescript
        run: npm run typecheck
      - working-directory: adapters/typescript
        run: npm test
      - name: validate npm package contents
        working-directory: adapters/typescript
        run: npm pack --dry-run
