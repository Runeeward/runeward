name: publish SDKs

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Existing release tag to publish (for example v0.3.0)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-sdks-${{ inputs.version || github.ref }}
  cancel-in-progress: false

jobs:
  verify-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.version || github.ref }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - name: Verify tag and package versions
        env:
          RELEASE_REF: ${{ inputs.version || github.ref_name }}
        run: python3 scripts/check-sdk-versions.py "$RELEASE_REF"

  build-python:
    needs: verify-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.version || github.ref }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - name: Build and validate distributions
        run: |
          python -m pip install --upgrade build twine
          python -m pip install ./adapters/python
          python -m unittest discover -s adapters/python/tests
          python -m build adapters/python
          python -m twine check adapters/python/dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-distributions
          path: adapters/python/dist/
          if-no-files-found: error

  build-npm:
    needs: verify-version
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: adapters/typescript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.version || github.ref }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Build and validate package
        run: |
          npm ci --ignore-scripts
          npm run typecheck
          npm test
          npm pack
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-distribution
          path: adapters/typescript/*.tgz
          if-no-files-found: error

  publish-python:
    needs: [build-python, build-npm]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/runeward
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-distributions
          path: dist
      - name: Publish runeward to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          # Tag workflows may be retried after one registry succeeds and the
          # other fails. Keep retries safe when this exact distribution is
          # already present on PyPI.
          skip-existing: true

  publish-npm:
    needs: [build-python, build-npm]
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/@runeward/sdk
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-distribution
          path: dist
      - name: Locate npm distribution
        id: npm-distribution
        shell: bash
        run: |
          shopt -s nullglob
          tarballs=(./dist/*.tgz)
          if (( ${#tarballs[@]} != 1 )); then
            echo "::error::expected exactly one npm tarball in ./dist, found ${#tarballs[@]}"
            exit 1
          fi
          echo "tarball=${tarballs[0]}" >> "$GITHUB_OUTPUT"
      - name: Publish stable @runeward/sdk to npm
        if: ${{ !contains(inputs.version || github.ref_name, '-') }}
        env:
          NPM_TARBALL: ${{ steps.npm-distribution.outputs.tarball }}
          RELEASE_REF: ${{ inputs.version || github.ref_name }}
        run: |
          version="${RELEASE_REF#v}"
          if npm view "@runeward/sdk@${version}" version >/dev/null 2>&1; then
            echo "@runeward/sdk@${version} already exists; skipping publish"
            exit 0
          fi
          npm publish "$NPM_TARBALL" --provenance
      - name: Publish prerelease @runeward/sdk to npm next channel
        if: ${{ contains(inputs.version || github.ref_name, '-') }}
        env:
          NPM_TARBALL: ${{ steps.npm-distribution.outputs.tarball }}
          RELEASE_REF: ${{ inputs.version || github.ref_name }}
        run: |
          version="${RELEASE_REF#v}"
          if npm view "@runeward/sdk@${version}" version >/dev/null 2>&1; then
            echo "@runeward/sdk@${version} already exists; skipping publish"
            exit 0
          fi
          npm publish "$NPM_TARBALL" --provenance --tag next
