# CodeQL static analysis for Go. Findings land in the Security > Code scanning
# tab as SARIF uploaded by the analyze step.
name: codeql

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly deep scan (Mondays 07:23 UTC).
    - cron: "23 7 * * 1"

# Least-privilege: read the repo, write code-scanning results.
permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: analyze (go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26.6"
          cache: true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: go
          config-file: ./.github/codeql/codeql-config.yml

      # Explicit build so CodeQL observes the full compilation of the module.
      - name: Build
        run: go build ./...

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          category: "/language:go"
