# CodeQL static analysis for the Rust workspace and the GitHub Actions
# workflows. Findings land in the Security > Code scanning tab as SARIF
# uploaded by the analyze step.
name: codeql

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly deep scan (Mondays 07:23 UTC).
    - cron: "23 7 * * 1"

# Least-privilege: read the repo, write code-scanning results.
permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Both languages are analyzed from source without a build
        # (build-mode: none); CodeQL's Rust extractor reads the Cargo
        # workspace directly.
        language: [rust, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:${{ matrix.language }}"
