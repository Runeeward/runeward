name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Existing release tag to publish (for example v0.3.0)"
        required: true
        type: string

permissions:
  contents: write
  packages: write
  # Required for cosign keyless (Fulcio/Rekor) signing via GitHub OIDC.
  id-token: write

env:
  REGISTRY: ghcr.io
  RELEASE_REF: ${{ inputs.version || github.ref_name }}

concurrency:
  group: release-${{ inputs.version || github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.version || github.ref }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26.6"
          cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Verify release source and package versions
        run: |
          go test ./...
          python3 scripts/check-sdk-versions.py "${RELEASE_REF}"
          PYTHONPATH=adapters/python python -m unittest discover -s adapters/python/tests
          cd adapters/typescript
          npm ci --ignore-scripts
          npm run typecheck
          npm test
      - name: Reject reachable Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.5.0 ./...

  image-security:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - dockerfile: deploy/Dockerfile
            image: runeward
          - dockerfile: deploy/Dockerfile.egress
            image: runeward-egress
          - dockerfile: deploy/Dockerfile.agent
            image: runeward-agent
          - dockerfile: deploy/Dockerfile.sandbox
            image: runeward-sandbox
          - dockerfile: deploy/Dockerfile.ide
            image: runeward-ide
            target: ide
          - dockerfile: deploy/Dockerfile.ide
            image: runeward-ide-agents
            target: ide-agents
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.version || github.ref }}
      - name: Build candidate image
        run: docker build ${{ matrix.target && format('--target {0}', matrix.target) || '' }} -f "${{ matrix.dockerfile }}" -t "${{ matrix.image }}:release-candidate" .
      - name: Reject high and critical image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ matrix.image }}:release-candidate
          severity: CRITICAL,HIGH
          exit-code: "1"

  # GoReleaser builds the cross-platform binaries, archives, checksums.txt and
  # SBOMs, and creates the GitHub Release for the tag.
  goreleaser:
    # Do not create a partial release when any shipped runtime image fails the
    # high/critical vulnerability gate.
    needs: [verify, image-security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.version || github.ref }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26.6"
          cache: true
      # syft powers the SBOM generation configured in .goreleaser.yaml.
      - uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
      # cosign signs checksums.txt (keyless) as configured in .goreleaser.yaml.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # PAT with write access to Runewardd/homebrew-tap. If the secret is
          # unset this is empty and the Homebrew upload is skipped (see the
          # skip_upload guard in .goreleaser.yaml), so releases still succeed.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

  images:
    needs: [verify, image-security]
    runs-on: ubuntu-latest
    # Don't upload the build-record (*.dockerbuild) artifacts; the release job
    # downloads all artifacts and those records can flake the download step.
    env:
      DOCKER_BUILD_RECORD_UPLOAD: "false"
      DOCKER_BUILD_SUMMARY: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.version || github.ref }}
      # GHCR only accepts lowercase repository paths; the org name is mixed-case.
      - name: Compute lowercase image name
        run: echo "IMAGE=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push runeward image
        id: runeward
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ env.RELEASE_REF }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ env.RELEASE_REF }}
          cache-from: type=gha,scope=runeward
          cache-to: type=gha,mode=max,scope=runeward

      - name: Build & push runeward-egress image
        id: egress
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: deploy/Dockerfile.egress
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE }}-egress:${{ env.RELEASE_REF }}
          cache-from: type=gha,scope=runeward-egress
          cache-to: type=gha,mode=max,scope=runeward-egress

      - name: Build & push runeward-agent image
        id: agent
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: deploy/Dockerfile.agent
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE }}-agent:${{ env.RELEASE_REF }}
          cache-from: type=gha,scope=runeward-agent
          cache-to: type=gha,mode=max,scope=runeward-agent

      - name: Build & push runeward-sandbox image
        id: sandbox
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: deploy/Dockerfile.sandbox
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE }}-sandbox:${{ env.RELEASE_REF }}
          cache-from: type=gha,scope=runeward-sandbox
          cache-to: type=gha,mode=max,scope=runeward-sandbox

      - name: Build & push runeward-ide image
        id: ide
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: deploy/Dockerfile.ide
          target: ide
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE }}-ide:${{ env.RELEASE_REF }}
          cache-from: type=gha,scope=runeward-ide
          cache-to: type=gha,mode=max,scope=runeward-ide

      - name: Build & push runeward-ide-agents image
        id: ide-agents
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: deploy/Dockerfile.ide
          target: ide-agents
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE }}-ide-agents:${{ env.RELEASE_REF }}
          cache-from: type=gha,scope=runeward-ide-agents
          cache-to: type=gha,mode=max,scope=runeward-ide-agents

      # Keyless (Fulcio/Rekor) signature over each image by digest. Signing the
      # digest covers every tag that points at it. Verify with:
      #   cosign verify ghcr.io/runewardd/runeward:<tag> \
      #     --certificate-identity-regexp 'https://github.com/Runewardd/runeward' \
      #     --certificate-oidc-issuer 'https://token.actions.githubusercontent.com'
      - name: Sign images with cosign (keyless)
        env:
          COSIGN_YES: "true"
          RUNEWARD_DIGEST: ${{ steps.runeward.outputs.digest }}
          EGRESS_DIGEST: ${{ steps.egress.outputs.digest }}
          AGENT_DIGEST: ${{ steps.agent.outputs.digest }}
          SANDBOX_DIGEST: ${{ steps.sandbox.outputs.digest }}
          IDE_DIGEST: ${{ steps.ide.outputs.digest }}
          IDE_AGENTS_DIGEST: ${{ steps.ide-agents.outputs.digest }}
        run: |
          cosign sign "${REGISTRY}/${IMAGE}@${RUNEWARD_DIGEST}"
          cosign sign "${REGISTRY}/${IMAGE}-egress@${EGRESS_DIGEST}"
          cosign sign "${REGISTRY}/${IMAGE}-agent@${AGENT_DIGEST}"
          cosign sign "${REGISTRY}/${IMAGE}-sandbox@${SANDBOX_DIGEST}"
          cosign sign "${REGISTRY}/${IMAGE}-ide@${IDE_DIGEST}"
          cosign sign "${REGISTRY}/${IMAGE}-ide-agents@${IDE_AGENTS_DIGEST}"

      - name: Promote stable images to latest
        if: ${{ !contains(env.RELEASE_REF, '-') }}
        run: |
          docker buildx imagetools create -t "${REGISTRY}/${IMAGE}:latest" "${REGISTRY}/${IMAGE}@${{ steps.runeward.outputs.digest }}"
          docker buildx imagetools create -t "${REGISTRY}/${IMAGE}-egress:latest" "${REGISTRY}/${IMAGE}-egress@${{ steps.egress.outputs.digest }}"
          docker buildx imagetools create -t "${REGISTRY}/${IMAGE}-agent:latest" "${REGISTRY}/${IMAGE}-agent@${{ steps.agent.outputs.digest }}"
          docker buildx imagetools create -t "${REGISTRY}/${IMAGE}-sandbox:latest" "${REGISTRY}/${IMAGE}-sandbox@${{ steps.sandbox.outputs.digest }}"
          docker buildx imagetools create -t "${REGISTRY}/${IMAGE}-ide:latest" "${REGISTRY}/${IMAGE}-ide@${{ steps.ide.outputs.digest }}"
          docker buildx imagetools create -t "${REGISTRY}/${IMAGE}-ide-agents:latest" "${REGISTRY}/${IMAGE}-ide-agents@${{ steps.ide-agents.outputs.digest }}"

  # Package the Helm chart and attach it to the release GoReleaser created.
  chart:
    needs: [goreleaser]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.version || github.ref }}
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: v3.16.2
      - name: Package Helm chart
        run: |
          mkdir -p dist-chart
          helm package deploy/helm/runeward --destination dist-chart \
            --version "${RELEASE_REF#v}" --app-version "${RELEASE_REF#v}"
      - name: Attach chart to release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ env.RELEASE_REF }}
          files: dist-chart/*.tgz

  # Ship the exact versioned Codex plugin directory used by the release tag.
  codex-plugin:
    needs: [goreleaser]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.version || github.ref }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - name: Verify plugin and release versions
        run: python3 scripts/check-sdk-versions.py "${RELEASE_REF}"
      - name: Package Codex plugin
        run: |
          version="${RELEASE_REF#v}"
          mkdir -p dist-plugin
          tar --exclude='__pycache__' --exclude='*.pyc' \
            -czf "dist-plugin/runeward-codex-plugin_${version}.tar.gz" \
            -C dist/codex-plugin runeward
      - name: Attach Codex plugin to release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ env.RELEASE_REF }}
          files: dist-plugin/*.tar.gz
