# Security automation: Rust supply-chain policy (cargo-deny: advisories,
# licenses, banned crates, sources), RustSec vulnerability scanning
# (cargo-audit), and repo + container image scanning (Trivy). Trivy results
# are uploaded as SARIF so they surface in the repository's Security > Code
# scanning tab. Rust SAST runs as CodeQL (codeql.yml) and clippy (ci.yml).
#
name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly full sweep (Mondays 06:17 UTC) to catch newly disclosed CVEs
    # even when the repo is quiet.
    - cron: "17 6 * * 1"

# Least-privilege default: jobs only read the repo. Jobs that upload SARIF
# opt into `security-events: write` explicitly below.
permissions:
  contents: read

jobs:
  # Supply-chain policy from deny.toml: RustSec advisories (every ignore is
  # scoped and explained there), the license allowlist, banned crates (no
  # OpenSSL or aws-lc; TLS is rustls with ring) and crates.io-only sources.
  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-deny@0.20.2
      - name: cargo deny check
        run: cargo deny --locked check

  # RustSec vulnerability scan of Cargo.lock (normal, build and dev edges).
  cargo-audit:
    name: cargo-audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-audit@0.22.2
      - name: cargo audit
        # RUSTSEC-2023-0071 only reaches a dev-dependency (see the scoped
        # ignore and its reason in deny.toml).
        run: cargo audit --ignore RUSTSEC-2023-0071

  # Filesystem scan of the repo: vulnerable dependencies, committed secrets,
  # and IaC/Dockerfile misconfigurations.
  trivy-fs:
    name: trivy (fs)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Trivy filesystem scan
        id: trivy
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          exit-code: "1"
          format: sarif
          # Keep accepted, path-scoped architecture exceptions reviewable in
          # source instead of re-failing findings already dismissed in GitHub.
          trivyignores: .trivyignore.yaml
          limit-severities-for-sarif: true
          output: trivy-fs.sarif
      - name: Upload Trivy fs SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs
      - name: Enforce Trivy filesystem gate
        if: steps.trivy.outcome == 'failure'
        run: |
          echo "::error::Trivy reported a high or critical repository finding"
          exit 1

  # Container image scan. Each Dockerfile is built locally (no push) and then
  # scanned for CRITICAL/HIGH OS + library vulnerabilities. A distinct SARIF
  # `category` per image keeps the uploads from colliding in the Security tab.
  trivy-image:
    name: trivy (image)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - dockerfile: deploy/Dockerfile
            image: runeward
          - dockerfile: deploy/Dockerfile.egress
            image: runeward-egress
          - dockerfile: deploy/Dockerfile.agent
            image: runeward-agent
          - dockerfile: deploy/Dockerfile.sandbox
            image: runeward-sandbox
          - dockerfile: deploy/Dockerfile.ide
            image: runeward-ide
            target: ide
          - dockerfile: deploy/Dockerfile.ide
            image: runeward-ide-agents
            target: ide-agents
          - dockerfile: deploy/Dockerfile.csi-directvolume
            image: runeward-csi-directvolume
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build ${{ matrix.image }} image
        run: |
          docker build ${{ matrix.target && format('--target {0}', matrix.target) || '' }} -f ${{ matrix.dockerfile }} -t ${{ matrix.image }}:ci .
      - name: Trivy image scan (${{ matrix.image }})
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ matrix.image }}:ci
          severity: CRITICAL,HIGH
          # Runtime images are a security boundary. Keep SARIF for triage, but
          # also fail the workflow so a high/critical regression cannot ship.
          exit-code: "1"
          format: sarif
          # trivy-action otherwise expands SARIF back to every severity, which
          # also makes exit-code fail on findings outside the configured gate.
          limit-severities-for-sarif: true
          output: trivy-${{ matrix.image }}.sarif
      - name: Upload Trivy image SARIF (${{ matrix.image }})
        if: always()
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy-${{ matrix.image }}.sarif
          category: trivy-image-${{ matrix.image }}
