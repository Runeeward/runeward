[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "runeward"
version = "0.4.0"
description = "Python SDK for Rune Box, the open-source governance harness for AI agents: policy, approvals, isolation, budgets, persistent workspaces and signed evidence."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Rune Box contributors" }]
keywords = ["ai", "agents", "sandbox", "mcp", "governance", "langchain", "crewai", "llamaindex", "openai-agents", "strands"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries",
  "Typing :: Typed",
]
# The core client is pure standard library — no runtime dependencies.
dependencies = []

[project.urls]
Homepage = "https://github.com/Runewardd/runeward"
Repository = "https://github.com/Runewardd/runeward"
Documentation = "https://runewardd.github.io/runeward/"
Issues = "https://github.com/Runewardd/runeward/issues"
Changelog = "https://github.com/Runewardd/runeward/releases"

[project.optional-dependencies]
# Framework adapters are opt-in; they are imported lazily so the base client
# works without any of these installed.
langchain = ["langchain-core>=0.2"]
crewai = ["crewai>=0.30", "pydantic>=2"]
llamaindex = ["llama-index-core>=0.11"]
openai-agents = ["openai-agents>=0.0.1"]
strands = ["strands-agents>=1.0"]

[tool.hatch.build]
# The monorepo root ignores the compiled `/runeward` binary. Hatch applies
# that VCS pattern relative to this nested project too, so explicitly retain
# the Python package directory in source and wheel distributions.
artifacts = ["/runeward"]

[tool.hatch.build.targets.wheel]
packages = ["runeward"]

[tool.hatch.build.targets.sdist]
include = [
  "/runeward",
  "/tests",
  "/LICENSE",
  "/README.md",
  "/pyproject.toml",
]
