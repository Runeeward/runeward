{{- if .Values.server.enabled -}}
{{- $fullname := include "runeward.fullname" . -}}
{{- if not .Values.server.auth.existingSecret }}
{{- $name := include "runeward.serverTokenSecretName" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "runeward.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
  annotations:
    # Keep the token when the release is uninstalled and reinstalled.
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if and $existing (index $existing.data .Values.server.auth.tokenKey) }}
  {{ .Values.server.auth.tokenKey }}: {{ index $existing.data .Values.server.auth.tokenKey }}
  {{- else }}
  {{ .Values.server.auth.tokenKey }}: {{ randAlphaNum 48 | b64enc }}
  {{- end }}
{{- end }}
{{- if and .Values.server.tls.enabled (not .Values.server.tls.existingSecret) }}
{{- $name := include "runeward.serverTLSSecretName" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "runeward.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
type: kubernetes.io/tls
data:
  {{- if and $existing (index $existing.data "tls.crt") }}
  tls.crt: {{ index $existing.data "tls.crt" }}
  tls.key: {{ index $existing.data "tls.key" }}
  {{- else }}
  {{- $svc := printf "%s-server" $fullname }}
  {{- $dns := list $svc (printf "%s.%s" $svc .Release.Namespace) (printf "%s.%s.svc" $svc .Release.Namespace) (printf "%s.%s.svc.cluster.local" $svc .Release.Namespace) "localhost" }}
  {{- $cert := genSelfSignedCert $svc (list "127.0.0.1") $dns 3650 }}
  tls.crt: {{ $cert.Cert | b64enc }}
  tls.key: {{ $cert.Key | b64enc }}
  {{- end }}
{{- end }}
{{- end }}
