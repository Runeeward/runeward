{{- if .Values.server.enabled -}}
{{- $serverSA := default (default (printf "%s-server" (include "runeward.fullname" .)) .Values.serviceAccount.name) .Values.serviceAccount.server.name -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "runeward.fullname" . }}-server
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "runeward.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  replicas: {{ .Values.server.replicas }}
  selector:
    matchLabels:
      {{- include "runeward.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        {{- include "runeward.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: server
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ $serverSA }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: server
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          image: {{ include "runeward.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - serve
            - --bind=0.0.0.0
            - --port={{ .Values.server.port }}
            {{- if .Values.server.tls.enabled }}
            - --tls-cert=/etc/runeward/tls/tls.crt
            - --tls-key=/etc/runeward/tls/tls.key
            {{- else }}
            - --allow-insecure-http
            {{- end }}
            {{- if .Values.server.noUI }}
            - --no-ui
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.server.port }}
          env:
            - name: RUNEWARD_K8S_NAMESPACE
              value: {{ .Release.Namespace | quote }}
            - name: RUNEWARD_CONFIG_DIR
              value: /etc/runeward/profiles
            - name: RUNEWARD_STATE_DIR
              value: {{ .Values.stateDir | quote }}
            - name: RUNEWARD_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "runeward.serverTokenSecretName" . }}
                  key: {{ .Values.server.auth.tokenKey }}
            - name: RUNEWARD_EGRESS_IMAGE
              value: {{ default (printf "%s-egress:%s" .Values.image.repository .Chart.AppVersion) .Values.egress.image | quote }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
              scheme: {{ ternary "HTTPS" "HTTP" .Values.server.tls.enabled }}
            initialDelaySeconds: 3
            periodSeconds: 10
          volumeMounts:
            - name: profiles
              mountPath: /etc/runeward/profiles
              readOnly: true
            - name: state
              mountPath: {{ .Values.stateDir }}
            {{- if .Values.server.tls.enabled }}
            - name: tls
              mountPath: /etc/runeward/tls
              readOnly: true
            {{- end }}
          resources:
            {{- toYaml .Values.server.resources | nindent 12 }}
      volumes:
        - name: profiles
          {{- include "runeward.profilesVolume" . | nindent 10 }}
        - name: state
          emptyDir: {}
        {{- if .Values.server.tls.enabled }}
        - name: tls
          secret:
            secretName: {{ include "runeward.serverTLSSecretName" . }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "runeward.fullname" . }}-server
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "runeward.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  type: {{ .Values.server.service.type }}
  selector:
    {{- include "runeward.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: server
  ports:
    - name: http
      port: {{ .Values.server.service.port }}
      targetPort: http
{{- end }}
