# Default values for the runeward chart.

image:
  repository: ghcr.io/runeeward/runeward
  # tag defaults to "v" + .Chart.AppVersion (the release tag) when empty.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  # Legacy override applied as fallback to all components when per-component
  # serviceAccount names are not set.
  name: ""
  annotations: {}
  controller:
    name: ""
  server:
    name: ""
  webhook:
    name: ""

rbac:
  create: true

controller:
  enabled: true
  replicas: 1
  workers: 2
  # Keep namespace scope by default; enabling this expands controller RBAC to
  # cluster-wide pod and exec access.
  allNamespaces: false
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: "1"
      memory: 256Mi

webhook:
  enabled: true
  port: 8443
  # >1 is safe: replicas share one serving cert via a Secret (see cert-secret).
  replicas: 2
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: "1"
      memory: 256Mi

server:
  enabled: false
  replicas: 1
  port: 8080
  noUI: false
  # The server binds every interface so the Service and the readiness probe
  # reach it, which requires an API token. Without existingSecret the chart
  # generates one (kept across upgrades) in "<fullname>-server-token"; read
  # it with:
  #   kubectl get secret <fullname>-server-token -o jsonpath='{.data.token}' | base64 -d
  auth:
    # Secret holding the API token (at least 32 characters) under tokenKey.
    existingSecret: ""
    tokenKey: token
  tls:
    # Serve HTTPS. Without existingSecret the chart generates a self-signed
    # certificate for the Service DNS names (kept across upgrades). false
    # serves plaintext HTTP: only behind a service mesh or ingress that
    # terminates TLS for every client.
    enabled: true
    # kubernetes.io/tls Secret (tls.crt, tls.key), e.g. from cert-manager.
    existingSecret: ""
  service:
    type: ClusterIP
    port: 8080
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi

# Profiles mounted at /etc/runeward/profiles (filename -> TOML). The chart
# stores them in a Secret by default (profiles can carry secret material).
# Reuse an existing Secret via existingSecret, or an existing ConfigMap via
# existingConfigMap (backward compatible). See docs for the profile schema.
profiles:
  create: false
  existingSecret: ""
  existingConfigMap: ""
  data: {}

egress:
  # Empty uses <image.repository>-egress:<image tag>. Override with a
  # digest-pinned reference for production deployments.
  image: ""

sandbox:
  # A StorageClass whose CSI driver hands volumes to Kata as direct-assigned
  # block devices and keeps each disk until its volume is deleted (Kata's
  # csi-kata-directvolume 4.2.0 does not; see docs/isolation.md). Sandboxes on
  # Kata with Firecracker (kata-fc) with [workspace] persist then get a real
  # disk as their workspace instead of a small guest tmpfs.
  # Empty: kata-fc workspaces stay ephemeral and persist is refused.
  directVolumeStorageClass: ""

# Opt-in default-deny NetworkPolicy for the control-plane namespace. Off by
# default: it only takes effect under a CNI that enforces NetworkPolicy, and a
# default-deny stance can surprise single-tenant operators. When enabled it
# denies all traffic, then allows intra-namespace ingress to the server/webhook
# ports plus egress to DNS and the Kubernetes API. Per-sandbox pods get their
# own in-cluster deny policy from the server via RUNEWARD_K8S_NETWORK_POLICY.
networkPolicy:
  enabled: false

# Pod Security Admission level applied to the runeward-managed namespace that
# hosts sandbox pods. The strict-egress sidecar needs NET_ADMIN, which the
# "baseline"/"restricted" levels forbid at enforcement time, so enforce defaults
# to "privileged" while warn/audit stay at "baseline" to surface violations
# without breaking egress. Set enforce to baseline/restricted only if you don't
# use strict egress. Maps to RUNEWARD_K8S_PSA_ENFORCE on the server/controller.
podSecurityStandard:
  enforce: privileged
  warn: baseline
  audit: baseline

stateDir: /var/lib/runeward

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
