misconfigurations:
  - id: DS-0002
    paths:
      - "deploy/Dockerfile.csi-directvolume"
    expired_at: 2027-10-21
    statement: >-
      The direct-volume CSI driver formats disks and bind-mounts them for the
      kubelet on the node, which needs root with the privileged container
      the Helm chart gives it. It runs only as that node plugin, never as a
      sandbox.
  - id: KSV-0053
    paths:
      - "deploy/helm/runeward/templates/rbac.yaml"
      - "crates/runeward-k8s/manifests/install/20-rbac.yaml"
    expired_at: 2027-08-07
    statement: >-
      Runeward's Kubernetes backend uses the pods/exec POST subresource to
      seed workspaces and execute governed commands inside Citadels. Access is
      limited to the Runeward controller and server service accounts.
  - id: KSV-0114
    paths:
      - "deploy/helm/runeward/templates/webhook.yaml"
    expired_at: 2027-08-07
    statement: >-
      The admission webhook must create and maintain Runeward's own named
      validating and mutating webhook configurations. Update and patch access
      is restricted with resourceNames; unscoped access is create-only.
